[project]
name = "home-inventory"
version = "0.1.0"
description = "Personal, mobile-first home inventory web app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "google-genai>=2.18",
    "google-cloud-storage>=2.19",
    "pillow>=11.0",
    "pillow-heif>=0.21",
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits real GCS or Vertex; needs ADC"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
